<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>测试页面</title>
    <style>
        /* 页面基本样式 */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: #f4f4f4;
            color: #333;
        }

        header {
            background-color: #4CAF50;
            color: white;
            text-align: center;
            padding: 20px;
        }

        main {
            padding: 20px;
        }

        /* 按钮计数器 */
        #counter {
            font-size: 24px;
            margin: 20px 0;
            font-weight: bold;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            border: none;
            background-color: #4CAF50;
            color: white;
            border-radius: 5px;
        }

        button:hover {
            background-color: #45a049;
        }

        /* 伪3D效果 */
        .card {
            width: 200px;
            height: 300px;
            background-color: #fff;
            border-radius: 10px;
            box-shadow: 5px 5px 15px rgba(0, 0, 0, 0.1), -5px -5px 15px rgba(255, 255, 255, 0.3);
            margin: 20px auto;
            transition: all 0.3s ease-in-out;
        }

        .card:hover {
            transform: translateY(-10px);
            box-shadow: 5px 10px 30px rgba(0, 0, 0, 0.2);
        }

        /* 彩蛋 */
        #easterEgg {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 20px;
            background-color: rgba(0, 0, 0, 0.7);
            color: white;
            border-radius: 10px;
            font-size: 20px;
            text-align: center;
        }

        /* ECharts 图表容器 */
        #chart {
            width: 100%;
            height: 400px;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<header>
    <h1>测试页面 - Spring Boot 后端测试</h1>
</header>

<main>
    <section>
        <div id="counter">
            当前计数: <span id="count">0</span>
        </div>
        <button id="countButton">点击增加计数</button>
    </section>

    <section>
        <div class="card">
            <h2>伪3D卡片</h2>
            <p>鼠标悬停时会有3D效果。</p>
        </div>
    </section>

    <section>
        <div id="easterEgg">
            🎉 彩蛋发现！你找到了彩蛋！ 🎉
        </div>
        <p>点击此处显示彩蛋：</p>
        <button id="eggButton">点我！</button>
    </section>

    <section>
        <div id="chart"></div>
    </section>
</main>

<!-- 引入 ECharts 和其他必要的库 -->
<script src="https://cdn.jsdelivr.net/npm/echarts@5.3.2/dist/echarts.min.js"></script>

<script>
    // 计数器逻辑
    let count = 0;
    const countButton = document.getElementById('countButton');
    const countDisplay = document.getElementById('count');
    
    countButton.addEventListener('click', () => {
        count++;
        countDisplay.textContent = count;
    });

    // 彩蛋逻辑
    const eggButton = document.getElementById('eggButton');
    const easterEgg = document.getElementById('easterEgg');
    
    eggButton.addEventListener('click', () => {
        easterEgg.style.display = 'block';
        setTimeout(() => {
            easterEgg.style.display = 'none';
        }, 3000);  // 3秒后隐藏彩蛋
    });

    // ECharts 图表展示
    var myChart = echarts.init(document.getElementById('chart'));
    
    var option = {
        title: {
            text: '动态数据图表',
            subtext: '数据展示',
            left: 'center'
        },
        tooltip: {},
        xAxis: {
            type: 'category',
            data: ['A', 'B', 'C', 'D', 'E', 'F', 'G']
        },
        yAxis: {
            type: 'value'
        },
        series: [{
            data: [12, 34, 45, 56, 67, 78, 89],
            type: 'line',
            smooth: true
        }]
    };

    myChart.setOption(option);

    // 动态更新图表数据
    setInterval(() => {
        var newData = option.series[0].data.map(item => item + Math.floor(Math.random() * 10));
        option.series[0].data = newData;
        myChart.setOption(option);
    }, 5000); // 每5秒更新一次数据
</script>

</body>
</html>
